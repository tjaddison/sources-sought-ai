version: '3.8'

services:
  # Email MCP Server
  email-mcp:
    build:
      context: ./sources-sought-email-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-email-mcp
    environment:
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
    restart: unless-stopped
    networks:
      - sources-sought-network

  # SAM.gov MCP Server
  sam-mcp:
    build:
      context: ./sources-sought-sam-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-sam-mcp
    environment:
      - SAM_API_KEY=${SAM_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Document Generation MCP Server
  docgen-mcp:
    build:
      context: ./sources-sought-docgen-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-docgen-mcp
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Search & Analysis MCP Server
  search-mcp:
    build:
      context: ./sources-sought-search-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-search-mcp
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Slack Integration MCP Server
  slack-mcp:
    build:
      context: ./sources-sought-slack-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-slack-mcp
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
    ports:
      - "8000:8000"  # Webhook port
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Database Operations MCP Server
  database-mcp:
    build:
      context: ./sources-sought-database-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-database-mcp
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - sources-sought-network

  # AWS Services MCP Server
  aws-mcp:
    build:
      context: ./sources-sought-aws-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-aws-mcp
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Relationship Management MCP Server
  crm-mcp:
    build:
      context: ./sources-sought-crm-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-crm-mcp
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Monitoring & Alerts MCP Server
  monitoring-mcp:
    build:
      context: ./sources-sought-monitoring-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-monitoring-mcp
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "9090:9090"  # Prometheus metrics port
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Prompt Catalog MCP Server
  prompts-mcp:
    build:
      context: ./sources-sought-prompts-mcp
      dockerfile: Dockerfile
    container_name: sources-sought-prompts-mcp
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: sources-sought-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: sources-sought-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - sources-sought-network

  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: sources-sought-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - sources-sought-network

networks:
  sources-sought-network:
    driver: bridge

volumes:
  grafana-data: